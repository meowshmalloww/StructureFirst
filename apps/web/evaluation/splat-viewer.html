<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StructureFirst reconstruction inspection</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        overflow: hidden;
        background: #171b22;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      aside {
        position: fixed;
        inset: 16px auto auto 16px;
        min-width: 250px;
        padding: 12px 14px;
        border: 1px solid rgb(255 255 255 / 14%);
        border-radius: 8px;
        background: rgb(15 18 23 / 88%);
        color: #f1f3f5;
        backdrop-filter: blur(8px);
      }
      strong,
      span {
        display: block;
      }
      span {
        margin-top: 5px;
        color: #aeb6c2;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <canvas aria-label="Full-resolution Gaussian evaluation viewer"></canvas>
    <aside>
      <strong id="status">Loading full-resolution splat…</strong>
      <span id="detail">Drag to look · WASD to move · QE up/down</span>
      <span id="stats">Waiting for GPU</span>
    </aside>
    <script type="module">
      import * as THREE from "three";
      import { SparkRenderer, SplatMesh } from "@sparkjsdev/spark";

      const source = new URLSearchParams(location.search).get("splat");
      if (!source) throw new Error("Provide ?splat=/absolute-or-served-path");

      const canvas = document.querySelector("canvas");
      const status = document.querySelector("#status");
      const stats = document.querySelector("#stats");
      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: false,
        alpha: false,
        powerPreference: "high-performance",
      });
      renderer.setClearColor(0x171b22, 1);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      const camera = new THREE.PerspectiveCamera(60, 1, 0.01, 1000);
      camera.up.set(0, -1, 0);
      camera.lookAt(new THREE.Vector3(0, 0, 1));
      const scene = new THREE.Scene();
      const spark = new SparkRenderer({
        renderer,
        sortRadial: false,
        preBlurAmount: 0,
        maxStdDev: Math.sqrt(8),
        minAlpha: 0.5 / 255,
        minSortIntervalMs: 20,
        enableLod: false,
      });
      scene.add(spark);
      const splat = new SplatMesh({
        url: source,
        lod: false,
        nonLod: true,
        enableLod: false,
        onProgress: (event) => {
          if (event.lengthComputable) {
            status.textContent = `Loading ${Math.round((event.loaded / event.total) * 100)}%`;
          }
        },
      });
      scene.add(splat);
      await splat.initialized;
      status.textContent = "Full-detail reconstruction ready";
      canvas.dataset.splatReady = "true";

      let yaw = 0;
      let pitch = 0;
      let dragging = false;
      let lastX = 0;
      let lastY = 0;
      const keys = new Set();
      canvas.addEventListener("pointerdown", (event) => {
        dragging = true;
        lastX = event.clientX;
        lastY = event.clientY;
        canvas.setPointerCapture(event.pointerId);
      });
      canvas.addEventListener("pointermove", (event) => {
        if (!dragging) return;
        yaw -= (event.clientX - lastX) * 0.003;
        pitch = Math.max(
          -Math.PI / 2 + 0.02,
          Math.min(Math.PI / 2 - 0.02, pitch - (event.clientY - lastY) * 0.003),
        );
        lastX = event.clientX;
        lastY = event.clientY;
      });
      canvas.addEventListener("pointerup", () => {
        dragging = false;
      });
      addEventListener("keydown", (event) => keys.add(event.code));
      addEventListener("keyup", (event) => keys.delete(event.code));

      const clock = new THREE.Clock();
      let rendered = 0;
      let windowStarted = performance.now();
      function render() {
        const width = innerWidth;
        const height = innerHeight;
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.setSize(width, height, false);
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
        const cosPitch = Math.cos(pitch);
        camera.lookAt(
          new THREE.Vector3(
            camera.position.x + Math.sin(yaw) * cosPitch,
            camera.position.y + Math.sin(pitch),
            camera.position.z + Math.cos(yaw) * cosPitch,
          ),
        );

        const elapsed = Math.min(clock.getDelta(), 0.05);
        const speed = (keys.has("ShiftLeft") ? 3 : 1.2) * elapsed;
        const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(
          camera.quaternion,
        );
        const right = new THREE.Vector3(1, 0, 0).applyQuaternion(
          camera.quaternion,
        );
        if (keys.has("KeyW")) camera.position.addScaledVector(forward, speed);
        if (keys.has("KeyS")) camera.position.addScaledVector(forward, -speed);
        if (keys.has("KeyA")) camera.position.addScaledVector(right, -speed);
        if (keys.has("KeyD")) camera.position.addScaledVector(right, speed);
        if (keys.has("KeyQ")) camera.position.y -= speed;
        if (keys.has("KeyE")) camera.position.y += speed;

        renderer.render(scene, camera);
        rendered += 1;
        const now = performance.now();
        if (now - windowStarted >= 750) {
          const fps = (rendered * 1000) / (now - windowStarted);
          const gl = renderer.getContext();
          const debug = gl.getExtension("WEBGL_debug_renderer_info");
          const gpu = gl.getParameter(
            debug?.UNMASKED_RENDERER_WEBGL ?? gl.RENDERER,
          );
          stats.textContent = `${Math.round(fps)} FPS · ${spark.activeSplats.toLocaleString()} active · ${gpu}`;
          canvas.dataset.renderFps = fps.toFixed(1);
          canvas.dataset.activeSplats = String(spark.activeSplats);
          canvas.dataset.gpuRenderer = String(gpu);
          rendered = 0;
          windowStarted = now;
        }
        requestAnimationFrame(render);
      }
      render();
    </script>
  </body>
</html>
